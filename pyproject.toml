[project]
name = "pipeline"
version = "0.1.0"
description = "Pipelines to convert a source connector to a sink connector"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click~=8.5",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "websockets>=14.0",
    "geojson>=3.2.0",
    "python-dotenv>=1.0.0",
    "frost-sta-client>=1.1.53",
    "psycopg2-binary>=2.9.10",
    "httpx2>=2.13.1",
]

[project.scripts]
pipeline = "pipeline:pipeline"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
    "pyright[nodejs]>=1.1.390",
    "testcontainers>=4.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    "notebooks",
]

[tool.pyright]
pythonVersion = "3.14"
include = ["src/pipeline", "src/tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
addopts = "--ignore=data"
markers = [
    "integration: integration test that requires docker containers, ...",
    "context: tests for context_mapping functionality",
    "asyncio: tests for async stuff",
]
